<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ULTRA Bot">
    <meta name="theme-color" content="#0a0e17">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192/10b981/white?text=U">
    <title>ULTRA Smart Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a0e17; --card: #111827; --border: #1f2937;
            --green: #10b981; --red: #ef4444; --blue: #3b82f6;
            --gold: #f59e0b; --purple: #8b5cf6; --text: #e5e7eb; --text2: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, sans-serif; padding: 16px;
            min-height: 100vh; padding-bottom: 100px;
        }
        .header { text-align: center; padding: 20px 0; }
        .logo {
            width: 56px; height: 56px; margin: 0 auto 10px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 28px;
        }
        h1 {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(135deg, #10b981, #3b82f6, #8b5cf6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: var(--text2); font-size: 12px; margin-top: 4px; }
        .live-dot {
            display: inline-block; width: 6px; height: 6px;
            background: var(--green); border-radius: 50%; margin-right: 4px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
        }
        
        /* Сетка кнопок */
        .menu-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0;
        }
        .menu-btn {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px 12px; text-align: center;
            cursor: pointer; transition: all 0.2s; text-decoration: none; color: var(--text);
        }
        .menu-btn:active { transform: scale(0.95); border-color: var(--blue); }
        .menu-btn .icon { font-size: 28px; display: block; margin-bottom: 6px; }
        .menu-btn .label { font-size: 11px; font-weight: 600; }
        
        .section {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px; margin: 10px 0;
        }
        .section h3 { font-size: 13px; margin-bottom: 8px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-card {
            background: var(--bg); border-radius: 10px; padding: 12px; text-align: center;
        }
        .stat-card .value { font-size: 22px; font-weight: 800; }
        .stat-card .label { font-size: 9px; color: var(--text2); text-transform: uppercase; }
        .green { color: var(--green); } .gold { color: var(--gold); }
        .blue { color: var(--blue); } .purple { color: var(--purple); }
        
        .progress-bar { height: 16px; background: var(--border); border-radius: 8px; overflow: hidden; }
        .progress-fill {
            height: 100%; border-radius: 8px; transition: width 0.8s;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700; color: white;
        }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 8px 0;
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 2px; cursor: pointer; padding: 4px 8px;
            color: var(--text2); font-size: 9px;
        }
        .nav-item.active { color: var(--blue); }
        .nav-item .icon { font-size: 20px; }
        
        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: var(--blue); color: white; padding: 10px 20px;
            border-radius: 20px; font-weight: 600; font-size: 13px;
            z-index: 999; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡</div>
        <h1>ULTRA Smart Money</h1>
        <p class="subtitle"><span class="live-dot"></span>Live • Bot v8.0</p>
    </div>

    <!-- Кнопки управления -->
    <div class="menu-grid">
        <div class="menu-btn" onclick="sendCommand('dashboard')">
            <span class="icon">📊</span>
            <span class="label">ДАШБОРД</span>
        </div>
        <div class="menu-btn" onclick="sendCommand('forex_signal')">
            <span class="icon">💱</span>
            <span class="label">FOREX СИГНАЛ</span>
        </div>
        <div class="menu-btn" onclick="sendCommand('otc_signal')">
            <span class="icon">💎</span>
            <span class="label">OTC СИГНАЛ</span>
        </div>
        <div class="menu-btn" onclick="sendCommand('auto_trade')">
            <span class="icon">🤖</span>
            <span class="label">АВТОТРЕЙДИНГ</span>
        </div>
        <div class="menu-btn" onclick="sendCommand('history')">
            <span class="icon">📜</span>
            <span class="label">ИСТОРИЯ</span>
        </div>
        <div class="menu-btn" onclick="sendCommand('analytics')">
            <span class="icon">📈</span>
            <span class="label">АНАЛИТИКА</span>
        </div>
        <div class="menu-btn" onclick="sendCommand('fundamental')">
            <span class="icon">📰</span>
            <span class="label">ФУНДАМЕНТ</span>
        </div>
        <div class="menu-btn" onclick="sendCommand('settings')">
            <span class="icon">⚙️</span>
            <span class="label">НАСТРОЙКИ</span>
        </div>
    </div>

    <!-- Статистика -->
    <div class="section">
        <h3>📊 Быстрая статистика</h3>
        <div class="stats-grid">
            <div class="stat-card"><div class="label">Сделок</div><div class="value gold" id="trades">0</div></div>
            <div class="stat-card"><div class="label">Винрейт</div><div class="value green" id="wr">0%</div></div>
            <div class="stat-card"><div class="label">CALL</div><div class="value blue" id="calls">0</div></div>
            <div class="stat-card"><div class="label">PUT</div><div class="value purple" id="puts">0</div></div>
        </div>
    </div>

    <!-- Прогресс -->
    <div class="section">
        <h3>Прогресс винрейта</h3>
        <div class="progress-bar"><div class="progress-fill" id="fill" style="width:0%">0%</div></div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="refreshStats()"><span class="icon">🔄</span>Обновить</div>
        <div class="nav-item" onclick="sendCommand('dashboard')"><span class="icon">📊</span>Дашборд</div>
        <div class="nav-item" onclick="sendCommand('forex_signal')"><span class="icon">💱</span>Forex</div>
        <div class="nav-item" onclick="sendCommand('otc_signal')"><span class="icon">💎</span>OTC</div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.expand) tg.expand();

        function showToast(msg) {
            const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
            document.body.appendChild(t); setTimeout(() => t.remove(), 1500);
        }

        function sendCommand(cmd) {
            if (tg) {
                tg.sendData(JSON.stringify({command: cmd}));
                tg.close();
            }
            showToast('Команда отправлена: ' + cmd);
        }

        function refreshStats() {
            const t = Math.floor(Math.random()*60)+30;
            const w = Math.random()*35+55;
            document.getElementById('trades').textContent = t;
            document.getElementById('wr').textContent = w.toFixed(1)+'%';
            document.getElementById('calls').textContent = Math.floor(t*0.55);
            document.getElementById('puts').textContent = t - Math.floor(t*0.55);
            
            const f = document.getElementById('fill');
            f.style.width = w+'%'; f.textContent = w.toFixed(1)+'%';
            f.style.background = w>=70 ? '#10b981' : w>=50 ? '#f59e0b' : '#ef4444';
            
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            showToast('Обновлено ✅');
        }

        refreshStats();
        setInterval(refreshStats, 30000);
    </script>
</body>
</html>
