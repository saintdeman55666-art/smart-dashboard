<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ULTRA Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0e17;color:#e5e7eb;font-family:-apple-system,sans-serif;padding:16px;min-height:100vh}
        .header{text-align:center;padding:16px 0}
        .logo{width:48px;height:48px;margin:0 auto 8px;background:linear-gradient(135deg,#10b981,#3b82f6);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px}
        h1{font-size:18px;font-weight:800}
        .btn{display:block;width:100%;padding:14px;border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin:8px 0;text-align:center}
        .btn.blue{background:linear-gradient(135deg,#3b82f6,#8b5cf6)}
        .btn.green{background:#10b981}
        .btn.gold{background:#f59e0b}
        .btn:active{transform:scale(.96)}
        .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#111827;border:1px solid #1f2937;border-radius:14px;margin:8px 0}
        .toggle{width:48px;height:26px;background:#1f2937;border-radius:13px;cursor:pointer;transition:background .3s}
        .toggle.on{background:#10b981}
        .toggle div{width:22px;height:22px;background:#fff;border-radius:50%;margin:2px;transition:transform .3s}
        .toggle.on div{transform:translateX(22px)}
        .section{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:14px;margin:10px 0}
        .section h3{font-size:13px;margin-bottom:8px;color:#9ca3af}
        .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
        .stat-card{background:#0a0e17;border-radius:10px;padding:10px;text-align:center}
        .stat-card .value{font-size:20px;font-weight:800}
        .stat-card .label{font-size:9px;color:#9ca3af;text-transform:uppercase}
        .green{color:#10b981}.gold{color:#f59e0b}.blue{color:#3b82f6}.purple{color:#8b5cf6}
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">⚡</div>
        <h1>ULTRA Smart Money</h1>
        <p style="color:#9ca3af;font-size:11px">v10.2 • <span style="color:#10b981">●</span> Live</p>
    </div>

    <div class="section">
        <h3>📊 Статистика (запрос из бота)</h3>
        <div class="stats-grid">
            <div class="stat-card"><div class="label">Сделок</div><div class="value gold" id="t">—</div></div>
            <div class="stat-card"><div class="label">Винрейт</div><div class="value green" id="w">—</div></div>
            <div class="stat-card"><div class="label">CALL</div><div class="value blue" id="c">—</div></div>
            <div class="stat-card"><div class="label">PUT</div><div class="value purple" id="p">—</div></div>
        </div>
    </div>

    <button class="btn blue" onclick="sendCmd('get_stats')">🔄 ЗАПРОСИТЬ СТАТИСТИКУ</button>
    <button class="btn green" onclick="sendCmd('forex')">💱 ЗАПРОСИТЬ FOREX СИГНАЛ</button>
    <button class="btn gold" onclick="sendCmd('otc')">💎 ЗАПРОСИТЬ OTC СИГНАЛ</button>

    <div class="section">
        <h3>🤖 Автотрейдинг</h3>
        <div class="toggle-row">
            <span>💱 Forex</span>
            <div class="toggle" id="tf" onclick="toggleAuto('forex')"><div></div></div>
        </div>
        <div class="toggle-row">
            <span>💎 OTC</span>
            <div class="toggle" id="to" onclick="toggleAuto('otc')"><div></div></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();
        let af=false, ao=false;
        
        function sendCmd(cmd){
            if(cmd==='get_stats'){
                if(tg) tg.sendData(JSON.stringify({get_stats:true}));
                alert('📊 Статистика отправлена в бот!');
            } else {
                if(tg){ tg.sendData(JSON.stringify({request_signal:cmd})); tg.close(); }
            }
        }
        
        function toggleAuto(type){
            if(type==='forex'){ af=!af; document.getElementById('tf').classList.toggle('on',af); if(tg) tg.sendData(JSON.stringify({auto_forex:af})); }
            else{ ao=!ao; document.getElementById('to').classList.toggle('on',ao); if(tg) tg.sendData(JSON.stringify({auto_otc:ao})); }
        }
    </script>
</body>
</html>
